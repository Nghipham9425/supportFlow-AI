services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: supportflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: supportflow
      POSTGRES_PASSWORD: supportflow_password
      POSTGRES_DB: supportflow_db
    ports:
      - "5432:5432"
    volumes:
      - supportflow_postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d

  adminer:
    image: adminer
    container_name: supportflow-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  supportflow_postgres_data:
